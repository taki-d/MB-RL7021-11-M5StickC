; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c]
; Keep clean CI builds on the versions validated on the device.
platform = espressif32@7.1.3
board = m5stick-c
framework = arduino
lib_deps = m5stack/M5StickCPlus@0.0.8
           mathieucarbou/ESP Async WebServer@3.0.6
           mathieucarbou/Async TCP@3.1.4

; ESP Async WebServer declares a Raspberry Pi Pico W backend as an optional
; dependency. It must not be built for this ESP32 target.
lib_ignore = AsyncTCP_RP2040W

monitor_speed =115200
